<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecturas UNED</title>
<meta name="description" content="Seguimiento de lecturas y tareas del Grado en Filosofía (UNED)">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lecturas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
:root{
  --bg:#f4efe6; --surface:#fffdf8; --surface-2:#ece5d8; --ink:#1f1b14; --ink-2:#5c5447; --ink-3:#8a8172;
  --line:#ddd4c4; --accent:#7a3b1d; --ok:#3f6b3a;
  --ipc:#2f5d73; --as1:#a4502a; --as2:#5f6b2e;
  --shadow:0 1px 0 rgba(31,27,20,.04),0 6px 20px -12px rgba(31,27,20,.25);
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16140f; --surface:#211e17; --surface-2:#2b271f; --ink:#f1ebdf; --ink-2:#c3baa9; --ink-3:#8f8676;
    --line:#383228; --accent:#e0956b; --ok:#8fbf7f;
    --ipc:#79aec6; --as1:#e48b5e; --as2:#b3c271;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 24px -14px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Top bar */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid transparent;padding-top:env(safe-area-inset-top);margin-top:calc(-1 * env(safe-area-inset-top))}
.bar.scrolled{border-bottom-color:var(--line)}
.bar-in{display:flex;align-items:center;gap:8px;min-height:52px}
.bar h2{flex:1;margin:0;font:600 17px/1.2 var(--sans);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:none;min-width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--accent);font-weight:600;padding:0 8px}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}

/* Home */
.hero{padding:12px 0 18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.hero h1{font:600 34px/1.05 var(--serif);margin:6px 0 14px;letter-spacing:-.01em}
.overall{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.overall .num{font:600 30px/1 var(--serif);font-variant-numeric:tabular-nums}
.overall .meta{flex:1;font-size:14px;color:var(--ink-2)}
.track{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.track>i{display:block;height:100%;border-radius:6px;background:var(--c,var(--accent));transition:width .4s cubic-bezier(.2,.8,.2,1)}

.section-label{margin:24px 2px 10px;font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.subjects{display:grid;gap:12px}
.subj{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r);padding:16px;box-shadow:var(--shadow);transition:transform .15s}
.subj:active{transform:scale(.985)}
.subj .code{display:inline-block;font:700 11px/1 var(--sans);letter-spacing:.1em;color:var(--c);border:1.5px solid var(--c);border-radius:6px;padding:4px 6px}
.subj .name{font:600 19px/1.2 var(--serif);margin:8px 0 4px}
.subj .sub{font-size:13px;color:var(--ink-3)}
.subj .txt{flex:1;min-width:0}
.ring{--p:0;--c:var(--accent);width:74px;height:74px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--surface-2)}
.ring .fgc{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;font:600 18px/1 var(--serif);font-variant-numeric:tabular-nums}
.ring b small{font-size:11px;font-family:var(--sans);color:var(--ink-3);font-weight:600}

/* Subject view */
.shead{padding:4px 0 14px;display:flex;gap:16px;align-items:center}
.shead h1{font:600 26px/1.1 var(--serif);margin:6px 0 4px}
.shead .sub{color:var(--ink-3);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7;font-variant-numeric:tabular-nums}

.block-label{margin:22px 2px 8px;font:600 13px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.topic-h{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:14px 16px}
.topic-h .tt{flex:1;min-width:0}
.topic-h .tn{font:600 16px/1.25 var(--serif)}
.topic-h .tm{font-size:12.5px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}
.topic-h .chev{width:18px;height:18px;color:var(--ink-3);transition:transform .2s;flex:none}
.topic.open .chev{transform:rotate(90deg)}
.topic-h .mini{width:44px;flex:none}
.topic-h .mini .track{margin:0}
.topic-h .pct{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;width:40px;text-align:right;color:var(--ink-2)}
.topic-h .pct.full{color:var(--ok)}
.items{display:none;border-top:1px solid var(--line)}
.topic.open .items{display:block}
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item:last-child{border-bottom:0}
.item:active{background:var(--surface-2)}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;margin-top:1px;transition:all .15s}
.check svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:all .15s;color:#fff}
.item.done .check{background:var(--c);border-color:var(--c)}
.item.done .check svg{opacity:1;transform:none}
.item .it{flex:1;min-width:0}
.item .title{font-size:15.5px}
.item.done .title{color:var(--ink-3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink-3) 60%,transparent)}
.item .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);margin-top:4px}
.item .tag .dot{width:7px;height:7px;border-radius:50%;background:var(--cc)}
.item .note{font-size:12.5px;color:var(--ink-3);margin-top:3px;font-style:italic}
.edit-ic{flex:none;color:var(--ink-3);width:20px;height:20px;margin-top:2px}
.add-row{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.add-row button{flex:1}
.empty{text-align:center;color:var(--ink-3);padding:40px 20px;border:1.5px dashed var(--line);border-radius:var(--r);margin-top:8px}
.empty p{margin:0 0 14px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#b3261e}
@media (prefers-color-scheme: dark){.btn.danger{color:#ff8a80}.btn.primary{color:#16140f}}
.btn.ghost{background:none}
.btn.small{padding:7px 10px;font-size:14px}
.btn:active{opacity:.75}
.row{display:flex;gap:10px}
.row>*{flex:1}
.mt{margin-top:16px}

/* Sheets */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:rgba(10,8,5,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -10px 40px rgba(0,0,0,.25);max-height:88vh;overflow:auto;animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sheet h3{font:600 20px/1.2 var(--serif);margin:0 0 14px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px}
textarea.inp{min-height:72px;resize:vertical}
.catpick{display:flex;flex-wrap:wrap;gap:8px}
.catlist .crow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.catlist input[type=color]{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--bg)}
.hint{font-size:13px;color:var(--ink-3);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:all .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
.view.enter{animation:fade .2s ease}
.update{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:12px 14px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.update .ut{flex:1;font-size:14px;color:var(--ink-2)}
.update .ut b{display:block;color:var(--ink);font-size:15px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>

    // LEGACY[idAntiguo] = [idNuevo, título/nombre original, ...]; si difiere, es que lo editó el usuario
    for(const s of st.subjects) for(const t of s.topics){
      const L = LEGACY[t.id];
      if(L){ t.id = L[0]; t.src = true; if(t.name !== L[1] || (t.block||"") !== L[2]) t.edited = true; }
      for(const i of t.items){ const M = LEGACY[i.id];
        if(M){ i.id = M[0]; i.src = true; if(i.title !== M[1] || i.cat !== M[2] || (i.note||"") !== M[3]) i.edited = true; } }
    }
    for(const s of st.subjects) s.src = true;
    st.cats.forEach(c => { if(["manual","lectura","material","video","test","entrega"].includes(c.id)) c.src = true; });
    st.version = 2; st.contentVersion = 1;
  }
  return st;
}

function fromContent(c){
  const cp = o => JSON.parse(JSON.stringify(o));
  return {
    version:2, contentVersion:c.contentVersion,
    cats: c.cats.map(x => ({...cp(x), src:true})),
    subjects: c.subjects.map(s => ({...cp(s), src:true, topics: s.topics.map(t => ({...cp(t), src:true,
      items: t.items.map(i => ({note:"", ...cp(i), done:false, src:true}))}))}))
  };
}

/* Fusiona el contenido nuevo en el estado del usuario.
   - Añade lo que falte (en su sitio).
   - Actualiza títulos, categorías y notas de lo que el usuario no ha editado.
   - Quita lo que ya no está en el contenido, salvo que esté marcado o editado por el usuario.
   - Nunca toca "done". */
function mergeContent(st, c){
  const r = {added:0, updated:0, removed:0};
  const gone = new Set(st.deleted || []);
  const set = (obj, k, v) => { if(v !== undefined && (obj[k] ?? "") !== (v ?? "")){ obj[k] = v; return 1; } return 0; };

  for(const cc of c.cats){
    const ex = st.cats.find(x => x.id === cc.id);
    if(gone.has(cc.id)) continue;
    if(!ex) st.cats.push({...cc, src:true});
    else if(!ex.edited){ set(ex,"name",cc.name); set(ex,"color",cc.color); }
  }

  const allTopics = () => st.subjects.flatMap(s => s.topics);
  const allItems = () => allTopics().flatMap(t => t.items);

  for(const cs of c.subjects){
    let s = st.subjects.find(x => x.id === cs.id);
    if(!s){ s = {id:cs.id, code:cs.code, name:cs.name, semester:cs.semester, color:cs.color, src:true, topics:[]}; st.subjects.push(s); }
    else if(!s.edited){ for(const k of ["code","name","semester","color"]) set(s,k,cs[k]); }

    let prevTopic = null;
    for(const ct of cs.topics){
      if(gone.has(ct.id)) continue;
      let t = allTopics().find(x => x.id === ct.id);
      if(!t){
        t = {id:ct.id, name:ct.name, block:ct.block || "", src:true, items:[]};
        const at = prevTopic ? s.topics.indexOf(prevTopic) + 1 : 0;
        s.topics.splice(at < 0 ? s.topics.length : at, 0, t);
      } else if(!t.edited){
        r.updated += set(t,"name",ct.name) | set(t,"block",ct.block || "");
      }
      if(s.topics.includes(t)) prevTopic = t;

      let prevItem = null;
      for(const ci of ct.items){
        if(gone.has(ci.id)) continue;
        let i = allItems().find(x => x.id === ci.id);
        if(!i){
          i = {id:ci.id, title:ci.title, cat:ci.cat, note:ci.note || "", done:false, src:true};
          const at = prevItem ? t.items.indexOf(prevItem) + 1 : t.items.length;
          t.items.splice(at < 0 ? t.items.length : at, 0, i); r.added++;
        } else if(!i.edited){
          r.updated += set(i,"title",ci.title) | set(i,"cat",ci.cat) | set(i,"note",ci.note || "");
        }
        if(t.items.includes(i)) prevItem = i;
      }
    }
  }

  // Retiradas: solo lo que vino del contenido, no está marcado y el usuario no ha editado.
  const keepT = new Set(c.subjects.flatMap(s => s.topics.map(t => t.id)));
  const keepI = new Set(c.subjects.flatMap(s => s.topics.flatMap(t => t.items.map(i => i.id))));
  for(const s of st.subjects){
    for(const t of s.topics){
      const before = t.items.length;
      t.items = t.items.filter(i => !i.src || i.edited || i.done || keepI.has(i.id));
      r.removed += before - t.items.length;
    }
    s.topics = s.topics.filter(t => !t.src || t.edited || keepT.has(t.id) || t.items.length);
  }

  st.contentVersion = c.contentVersion;
  return r;
}

async function fetchContent(){
  const res = await fetch("content.json?v=" + Date.now(), {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP " + res.status);
  const c = await res.json();
  if(!Array.isArray(c.subjects) || typeof c.contentVersion !== "number") throw new Error("content.json no válido");
  return c;
}

let S, pending = null;
try { S = migrate(JSON.parse(localStorage.getItem(KEY))); } catch(e) { S = null; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("No se pudo guardar"); } }
if(S) save();

async function checkUpdates(manual){
  try{
    const c = await fetchContent();
    if(!S){ S = fromContent(c); save(); render(); return; }
    if(c.contentVersion > (S.contentVersion || 0)){ pending = c; render(); if(manual) toast("Hay contenido nuevo"); }
    else if(manual) toast("Ya tienes el contenido al día");
  }catch(e){
    if(!S) showOffline(); else if(manual) toast("Sin conexión: inténtalo más tarde");
  }
}
function applyUpdate(){
  if(!pending) return;
  const r = mergeContent(S, pending); pending = null; save(); render();
  const parts = [];
  if(r.added) parts.push(`${r.added} nuevas`);
  if(r.updated) parts.push(`${r.updated} cambios`);
  if(r.removed) parts.push(`${r.removed} retiradas`);
  toast(parts.length ? "Actualizado: " + parts.join(" · ") : "Contenido actualizado");
}
function showOffline(){
  document.getElementById("app").innerHTML = `<div class="empty" style="margin-top:40px"><p>Necesitas conexión la primera vez para descargar las lecturas.</p>

}

function ring(p, c, size){
  const r = 30, C = 2*Math.PI*r;
  return `<div class="ring" style="--c:${c}${size?`;width:${size}px;height:${size}px`:""}">
    <svg viewBox="0 0 74 74"><circle class="bgc" cx="37" cy="37" r="${r}" fill="none" stroke-width="7"/>
    <circle class="fgc" cx="37" cy="37" r="${r}" fill="none" stroke-width="7" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"/></svg>
    <b>${p}<small>%</small></b></div>`;
}

  const chips = items.length ? `<div class="chips">
      <button class="chip" aria-pressed="${f==="all"}" data-a="filter" data-id="all">Todas <small>${st.d}/${st.t}</small></button>
      <button class="chip" aria-pressed="${f==="pending"}" data-a="filter" data-id="pending">Pendientes <small>${st.t-st.d}</small></button>
      ${usedCats.map(c => { const cs = stats(items.filter(i=>i.cat===c.id));
        return `<button class="chip" style="--cc:${c.color}" aria-pressed="${f===c.id}" data-a="filter" data-id="${c.id}"><span class="dot"></span>${esc(c.name)} <small>${cs.d}/${cs.t}</small></button>`; }).join("")}
    </div>` : "";
  const match = i => f==="all" || (f==="pending" ? !i.done : i.cat===f);
  let lastBlock = null, html = "";
  for(const t of s.topics){
    const vis = t.items.filter(match);
    if(!vis.length && f!=="all" && !ui.edit) continue;
    if(t.block && t.block !== lastBlock){ html += `<div class="block-label">${esc(t.block)}</div>`; lastBlock = t.block; }
    const ts = stats(t.items), open = ui.open.has(t.id) || ui.edit || f!=="all";
    html += `<section class="topic ${open?"open":""}">
      <button class="topic-h" data-a="${ui.edit?"editTopic":"toggleTopic"}" data-id="${t.id}">
        <div class="tt"><div class="tn">${esc(t.name)}</div><div class="tm">${ts.d} de ${ts.t}</div></div>
        ${ui.edit ? I.pen : `<div class="mini"><div class="track"><i style="width:${ts.p}%"></i></div></div>
        <div class="pct ${ts.p===100&&ts.t?"full":""}">${ts.p}%</div>${I.chev}`}
      </button>
      <div class="items">${vis.map(i => { const c = cat(i.cat);
        return `<button class="item ${i.done?"done":""}" data-a="${ui.edit?"editItem":"toggleItem"}" data-id="${i.id}" data-t="${t.id}">
          ${ui.edit ? "" : `<span class="check">${I.tick}</span>`}

      </div></section>`;
  }
  if(!s.topics.length){
    html = `<div class="empty"><p>Todavía no hay temas en esta asignatura.</p>
      <button class="btn primary" data-a="addTopic">+ Añadir tema</button></div>`;
  } else if(ui.edit){
    html += `<button class="btn mt" style="width:100%" data-a="addTopic">+ Añadir tema</button>`;
  }
  app.innerHTML = `<div class="view${enter}" style="--c:${cvar(s)}">
    <section class="shead"><div style="flex:1;min-width:0">
      <span class="eyebrow" style="color:${cvar(s)}">${esc(s.semester)}</span>

      ${ring(st.p, cvar(s))}</section>
    ${chips}${html}</div>`;
}

  };
  list.onclick = e => { const b = e.target.closest("[data-del]"); if(!b) return;
    const row = b.closest(".crow"), id = row.dataset.id;
    const used = S.subjects.flatMap(allItems).filter(i=>i.cat===id).length;
    if(used && !confirm(`Hay ${used} elementos con esta categoría. Quedarán «Sin categoría». ¿Eliminar?`)) return;
    row.remove(); };
  $("#saveCats").onclick = () => {
    const kept = new Set([...list.querySelectorAll(".crow")].map(r => r.dataset.id));
    S.cats.filter(c => !kept.has(c.id)).forEach(tomb);
    S.cats = [...list.querySelectorAll(".crow")].map(r => { const old = S.cats.find(c=>c.id===r.dataset.id) || {};
      const c = {...old, id:r.dataset.id, color:r.querySelector("[type=color]").value, name:r.querySelector(".inp").value.trim()};
      if(old.src && (old.name!==c.name || old.color!==c.color)) c.edited = true; return c; }).filter(c=>c.name);

    sheet.querySelectorAll("[data-sname]").forEach(inp => { const s = subj(inp.dataset.sname); if(s && inp.value.trim() && s.name !== inp.value.trim()){ s.name = inp.value.trim(); s.edited = true; } });
    save(); render(); toast("Guardado");
  };
  $("#exp").onclick = async () => {
    const name = `lecturas-uned-${new Date().toISOString().slice(0,10)}.json`;
    const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
    const file = new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e.name==="AbortError") return; } }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  };
  $("#imp").onclick = () => $("#file").click();
  $("#file").onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try{ const d = JSON.parse(await f.text()); if(!Array.isArray(d.subjects) || !Array.isArray(d.cats)) throw 0;
      if(confirm("Esto sustituye todos los datos actuales por los de la copia. ¿Continuar?")){ S = migrate(d); save(); closeSheet(); ui.view="home"; render(); toast("Copia importada"); } }
    catch(_){ toast("Ese archivo no es una copia válida"); }
  };
  $("#reset").onclick = () => { if(confirm("Se borrará todo tu progreso y volverán las lecturas iniciales. ¿Seguro?")){ closeSheet(); fetchContent().then(c => { S = fromContent(c); pending = null; save(); ui.view="home"; render(); toast("Restablecido"); }).catch(() => toast("Necesitas conexión para restablecer")); } };
  $("#close").onclick = closeSheet;
  $("#chk").onclick = async () => { closeSheet(); await checkUpdates(true); };
}

/* ---------- Eventos ---------- */
let toastT;
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 1800); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if(!el || el.closest("dialog")) return;
  const a = el.dataset.a, id = el.dataset.id, s = ui.sid && subj(ui.sid);
  switch(a){
    case "open": ui.view="subject"; ui.sid=id; ui.filter="all"; ui.edit=false; ui.open = new Set(); history.pushState({v:"s",id},""); render(); scrollTo(0,0); break;
    case "home": history.length > 1 && history.state ? history.back() : (ui.view="home", render()); break;
    case "settings": settingsSheet(); break;
    case "applyUpdate": applyUpdate(); break;
    case "toggleEdit": ui.edit = !ui.edit; render(); break;
    case "filter": ui.filter = id; render(); break;
    case "toggleTopic": ui.open.has(id) ? ui.open.delete(id) : ui.open.add(id); render(); break;
    case "toggleItem": {
      const t = s.topics.find(x=>x.id===el.dataset.t), i = t.items.find(x=>x.id===id);
      i.done = !i.done; i.doneAt = i.done ? new Date().toISOString() : undefined; save();
      if(navigator.vibrate) navigator.vibrate(8);
      const before = stats(t.items).p; render();
      if(i.done && before===100) toast(`${t.name.split(" · ")[0]} completado`);
      break; }
    case "editItem": itemSheet(el.dataset.t, id); break;
    case "addItem": itemSheet(el.dataset.t, null); break;
    case "editTopic": topicSheet(id); break;
    case "addTopic": topicSheet(null); break;
  }
});
addEventListener("popstate", () => { ui.view = "home"; ui.edit = false; render(); });
addEventListener("scroll", () => $("#bar").classList.toggle("scrolled", scrollY > 4), {passive:true});

function tomb(o){ if(o.src){ (S.deleted ||= []).includes(o.id) || S.deleted.push(o.id); } }
render();
checkUpdates(false);
let lastCheck = Date.now();
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && Date.now() - lastCheck > 10*60*1000){ lastCheck = Date.now(); checkUpdates(false); }
});
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
